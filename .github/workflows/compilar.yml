name: "Compilar Juego de Godot"

on:
  push:
    branches:
      - main

jobs:
  export_game:
    runs-on: ubuntu-22.04
    name: Exportar Ejecutable
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglvnd-dev libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 libxrender1 libxtst6 libasound2

      - name: Descargar e instalar Godot 4.4
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          mv Godot_v4.4-stable_linux.x86_64 godot
          chmod +x godot

          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q Godot_v4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          mv templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Pre-importar recursos del juego (Paso 1)
        run: |
          ./godot --headless --editor --quit || true

      - name: Compilar ejecutable para Windows (Paso 2)
        run: |
          mkdir -p build
          ./godot --headless --export-release "Windows Desktop" build/JuegoLaberinto.exe

      - name: Guardar ejecutable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: juego-compilado
          path: build/
