name: "Compilar Juego de Godot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Exportar Ejecutable

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v5

      - name: Descargar Godot y plantillas de exportacion
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

          ./godot --version

      # Verificacion barata que evita el crash silencioso (exit 134).
      # Godot revienta si encuentra un project.godot dentro de una subcarpeta.
      - name: Verificar que no hay proyectos Godot anidados
        run: |
          ANIDADOS=$(find . -mindepth 2 -name project.godot -not -path "./.git/*" || true)
          if [ -n "$ANIDADOS" ]; then
            echo "::error::Hay project.godot anidados. Godot va a crashear (exit 134). Borralos:"
            echo "$ANIDADOS"
            exit 1
          fi
          echo "OK: solo hay un project.godot en la raiz."

      - name: Importar recursos del proyecto
        run: |
          ./godot --headless --audio-driver Dummy --import

      - name: Exportar ejecutable de Windows
        run: |
          mkdir -p build/windows
          ./godot --headless --audio-driver Dummy \
            --export-release "Windows Desktop" build/windows/JuegoLaberinto.exe
          ls -lh build/windows

      - name: Exportar version Web (HTML5)
        run: |
          mkdir -p build/web
          ./godot --headless --audio-driver Dummy \
            --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Guardar ejecutable de Windows
        uses: actions/upload-artifact@v4
        with:
          name: juego-windows
          path: build/windows/

      - name: Guardar version Web
        uses: actions/upload-artifact@v4
        with:
          name: juego-web
          path: build/web/

      - name: Preparar artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Publica la version web en https://ariel-2006.github.io/Juego-Laberinto/
  # Requiere activar Pages en Settings > Pages > Source: GitHub Actions
  publicar_web:
    needs: export_game
    runs-on: ubuntu-latest
    name: Publicar version Web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
